<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101820"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="反射迷宮"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>RICHOCHET / 反射迷宮</title><style>
:root{color-scheme:dark;--bg:#101820;--panel:#182630;--line:#38505e;--ink:#e7f0f3;--muted:#9eb4bd;--cyan:#5fe1d0;--gold:#ffd166}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1b303b,#101820 55%);color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace;min-height:100vh;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);display:flex;justify-content:center}main{width:min(720px,100%);padding:14px 0 24px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 12px}.brand{font-weight:900;letter-spacing:.12em;font-size:clamp(17px,4.5vw,24px)}.sub{font-size:11px;color:var(--muted);margin-top:4px}.pill{border:1px solid var(--line);padding:7px 9px;border-radius:99px;color:var(--cyan);font-size:11px}.panel{background:#15232cdd;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.level{font:inherit;background:#101a21;color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:10px 4px;font-size:13px}.level.active{border-color:var(--cyan);color:var(--cyan);background:#183b40}.level:disabled{opacity:1;cursor:default}.stats{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-bottom:10px}.stats strong{color:var(--gold);font-size:16px}.board-wrap{display:flex;justify-content:center;align-items:center}#board{display:grid;gap:2px;width:100%;max-width:590px;aspect-ratio:1;background:#0b1217;padding:5px;border:1px solid #3d5663;border-radius:8px;touch-action:manipulation}.cell{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;background:#172832;color:#9db3bd;border-radius:2px;font-size:clamp(10px,2.8vw,20px);font-weight:700;user-select:none}.cell.wall{background:#405777;color:#a9c3e4}.cell.goal{background:#a86112;color:#fff4a1;border:2px solid #ffe074;box-shadow:0 0 12px #ffbb3399;font-size:clamp(18px,4vw,30px)}.cell.warp{background:#382e51;color:#d4b8ff;border:1px solid #8e6ad0}.cell.warp0{background:#5a296f;color:#f2b6ff}.cell.warp1{background:#145c70;color:#8af5ff}.cell.warp2{background:#78501a;color:#ffdf88}.cell.warp3{background:#235c35;color:#a8f4b5}.cell.player{color:#101820;background:var(--cyan)}.cell.player.goal{background:var(--gold)}.legend{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:11px;margin-top:9px}.legend b{color:var(--ink)}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:250px;margin:12px auto 0}.controls button,.actions button{font:inherit;color:var(--ink);background:#203541;border:1px solid #486473;border-radius:10px;padding:13px 8px;font-size:18px}.controls .empty{visibility:hidden}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.actions button{font-size:12px;padding:11px 4px}.actions .primary{border-color:var(--cyan);color:var(--cyan)}.message{font-size:12px;line-height:1.6;color:var(--muted);min-height:38px;margin-top:10px}.message strong{color:var(--gold)}.hint{font-size:11px;color:var(--muted);line-height:1.6;margin:8px 2px 0}@media(min-width:560px){.layout{display:grid;grid-template-columns:1fr 210px;gap:12px;align-items:start}}
</style></head><body><main><header class="top"><div><div class="brand">⟦ RICOCHET ⟧</div><div class="sub">反射迷宮 // SLIDE UNTIL STOP</div></div><div class="pill">RANDOM MAP</div></header><section class="panel"><div class="levels"><button class="level active" data-level="easy">EASY<br><small>ランダム</small></button><button class="level" data-level="normal">NORMAL<br><small>ランダム</small></button><button class="level" data-level="hard">HARD<br><small>ランダム</small></button></div></section><div class="layout"><div><section class="panel"><div class="stats"><span id="stageLabel">EASY</span><span>手数 <strong id="moves">0</strong></span><span>最短 <strong id="best">?</strong></span></div><div class="board-wrap"><div id="board"></div></div><div class="legend"><span><b>@</b> あなた</span><span><b>★</b> ゴール</span><span><b>█</b> 壁</span><span><b>A/B/C/D</b> ワープ</span></div><div class="message" id="message" aria-live="polite">方向を選ぶと、壁にぶつかるまで滑ります。</div></section></div><div class="side"><section class="panel"><div style="font-size:12px;color:var(--cyan)">MOVE</div><div class="controls"><button class="empty">·</button><button data-dir="up">▲</button><button class="empty">·</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><div class="actions"><button id="undo">↶ 戻す</button><button id="hintBtn">？ ヒント</button><button class="primary" id="newGame">新しい盤面</button></div><div class="hint">・上下左右に滑走します。<br>・HARDは同じ文字のワープ間を移動し、出口で停止。<br>・難易度は毎回ランダム。解ける盤面だけ生成。</div></section><section class="panel"><div style="font-size:12px;color:var(--cyan)">RECORD</div><div id="record" style="font-size:12px;line-height:1.8;color:var(--muted)">クリア記録: 0</div><div class="actions"><button id="resetRecord" style="grid-column:1/4">記録をリセット</button></div></section></div></div></main><script src="game.js"></script></body></html>
