<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101329"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="反射迷宮"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>RICHOCHET // 反射迷宮</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101329;color:#f5f4ff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{background:radial-gradient(ellipse at 50% 0%,#28224c 0%,#101329 65%)}main{max-width:600px;margin:auto;padding:calc(env(safe-area-inset-top) + 5px) 10px calc(env(safe-area-inset-bottom) + 6px);display:flex;flex-direction:column;gap:7px;min-height:100dvh}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-size:clamp(16px,4.8vw,23px);font-weight:900;letter-spacing:.11em;color:#8ef9ec;text-shadow:0 0 12px #5fffee44}.meta{font-size:11px;color:#c8b7f4}.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:#b8c4df}.hud b{color:#ffd56e;font-size:16px}.board-shell{display:flex;justify-content:center;min-height:0;flex:1;align-items:center}#board{display:grid;gap:2px;padding:5px;border:2px solid #7367bf;border-radius:10px;background:#0b1024;box-shadow:0 0 18px #8965ff35;width:min(calc(100vw - 20px),calc(100dvh - 255px),560px);aspect-ratio:1;max-width:100%;max-height:100%}.cell{min-width:0;min-height:0;border-radius:3px;display:flex;align-items:center;justify-content:center;background:#1b2541;color:#56658c;font-size:clamp(10px,2.8vw,19px);font-weight:800;user-select:none}.cell.wall{background:#394f82;color:#91b4f5}.cell.goal{background:#ffb84b;color:#33203b;box-shadow:inset 0 0 0 2px #fff2a6,0 0 10px #ffb84b99}.cell.warp{background:#55346f;color:#f2c2ff;box-shadow:inset 0 0 0 1px #bc77ed}.cell.player{background:#50edc5;color:#112a39;box-shadow:0 0 12px #50edc588}.cell.player.goal{background:#fff48d}.note{min-height:19px;color:#e1d5ff;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bottom{display:grid;grid-template-columns:minmax(135px,1fr) minmax(120px,1fr);gap:9px;align-items:center}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:225px;width:100%;margin:auto}.pad button,.tools button{border:1px solid #7a6cc1;border-radius:9px;background:#30335b;color:#f3efff;font:inherit;font-weight:900;min-height:43px;font-size:19px;touch-action:manipulation}.pad button:active,.tools button:active{background:#514e91}.pad .blank{visibility:hidden}.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tools button{min-height:40px;font-size:12px}.foot{font-size:10px;color:#b7acd4;display:flex;justify-content:space-between;gap:4px}.foot span{white-space:nowrap} @media(max-height:680px){main{gap:4px}.pad button{min-height:36px}.tools button{min-height:34px}#board{width:min(calc(100vw - 20px),calc(100dvh - 225px),560px)}}

.modes{display:flex;gap:4px}.modes button{font:inherit;font-size:10px;font-weight:800;border-radius:7px;padding:7px 6px;border:1px solid #5f5797;background:#252446;color:#d8cfff}.modes button.selected{border-color:#50edc5;background:#245657;color:#dffff7}.restart-row{display:flex;justify-content:flex-end;margin-top:-4px}.restart-row button{font:inherit;font-size:10px;color:#d4c5ee;background:#26233f;border:1px solid #524977;border-radius:6px;padding:5px 8px;min-height:24px}.tools #next[hidden],#timer[hidden],#score[hidden]{display:none}#timer{color:#ffda64;font-variant-numeric:tabular-nums}.hud{flex-wrap:wrap}.pad button{min-height:44px}.bottom{grid-template-columns:minmax(135px,1.2fr) minmax(105px,.8fr)}.tools{align-self:center}#board{width:min(calc(100vw - 20px),calc(100dvh - 250px),560px)}@media(max-height:680px){#board{width:min(calc(100vw - 20px),calc(100dvh - 230px),560px)}}

#board{gap:1px;padding:4px}
.cell{border-radius:2px;font-size:clamp(9px,2.4vw,16px)}
@media(max-width:430px){main{padding-left:7px;padding-right:7px}#board{width:min(calc(100vw - 14px),calc(100dvh - 250px),560px)}}

</style></head><body><main><header class="top"><div class="brand">⟦ RICOCHET ⟧</div><div class="modes"><button id="modeEndless" class="selected">∞ エンドレス</button><button id="modeTime1">⏱ 1分</button><button id="modeTime3">3分</button><button id="modeTime5">5分</button></div></header><div class="hud"><span id="mapinfo">MAP</span><span id="gemInfo">◆</span><span>手数 <b id="moves">0</b></span><span>最短 <b id="optimal">?</b></span><span id="score" hidden>突破 <b id="cleared">0</b></span><b id="timer" hidden>05:00</b></div><section class="board-shell"><div id="board" aria-label="反射迷宮の盤面"></div></section><div class="note" id="message" aria-live="polite">@ を滑らせて ★ を目指そう！</div><section class="bottom"><div class="pad"><button class="blank" tabindex="-1">.</button><button data-dir="up" aria-label="上">▲</button><button class="blank" tabindex="-1">.</button><button data-dir="left" aria-label="左">◀</button><button data-dir="down" aria-label="下">▼</button><button data-dir="right" aria-label="右">▶</button></div><div class="tools"><button id="undo">↶ 戻す</button><button id="hint">？ ヒント</button></div></section><div class="restart-row"><button id="restart">✦ 新しい迷宮</button></div><div class="foot"><button id="statsButton">▤ 記録</button><span>@ 自機　★ ゴール　█ 壁</span><span id="warplegend">A↔A ワープ</span></div><div id="statsPanel" hidden><div id="statsCard"><button id="statsClose">閉じる</button><strong>▤ プレイ記録</strong><div id="statsText"></div></div></div></main><script src="game.js?v=8"></script></body></html>
