*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101329;color:#f5f4ff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{background:radial-gradient(ellipse at 50% 0%,#28224c 0%,#101329 65%)}main{max-width:600px;margin:auto;padding:calc(env(safe-area-inset-top) + 5px) 10px calc(env(safe-area-inset-bottom) + 6px);display:flex;flex-direction:column;gap:7px;min-height:100dvh}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-size:clamp(16px,4.8vw,23px);font-weight:900;letter-spacing:.11em;color:#8ef9ec;text-shadow:0 0 12px #5fffee44}.meta{font-size:11px;color:#c8b7f4}.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:#b8c4df}.hud b{color:#ffd56e;font-size:16px}.board-shell{display:flex;justify-content:center;min-height:0;flex:1;align-items:center}#board{display:grid;gap:2px;padding:5px;border:2px solid #7367bf;border-radius:10px;background:#0b1024;box-shadow:0 0 18px #8965ff35;width:min(calc(100vw - 20px),calc(100dvh - 255px),560px);aspect-ratio:1;max-width:100%;max-height:100%}.cell{min-width:0;min-height:0;border-radius:3px;display:flex;align-items:center;justify-content:center;background:#1b2541;color:#56658c;font-size:clamp(10px,2.8vw,19px);font-weight:800;user-select:none}.cell.wall{background:#394f82;color:#91b4f5}.cell.goal{background:#ffb84b;color:#33203b;box-shadow:inset 0 0 0 2px #fff2a6,0 0 10px #ffb84b99}.cell.warp{background:#55346f;color:#f2c2ff;box-shadow:inset 0 0 0 1px #bc77ed}.cell.player{background:#50edc5;color:#112a39;box-shadow:0 0 12px #50edc588}.cell.player.goal{background:#fff48d}.note{min-height:19px;color:#e1d5ff;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bottom{display:grid;grid-template-columns:minmax(135px,1fr) minmax(120px,1fr);gap:9px;align-items:center}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:225px;width:100%;margin:auto}.pad button,.tools button{border:1px
